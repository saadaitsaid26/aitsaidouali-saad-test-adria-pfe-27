# config-service : Spring Cloud Config Server, profil native -> dossier config-repo/ (P3)
spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # scanne le dossier versionne du projet (run : root du repo ou Docker WORKDIR)
          search-locations: file:./config-repo, file:../config-repo

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
