# event-consumer-service : client Config + Eureka (P3)
spring:
  application:
    name: event-consumer-service
  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8888}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
