# account-service : client Config + Eureka (P3) + datasource H2 JPA (P4) + GraphQL/MCP (P5)
spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8888}
  datasource:
    # Base H2 en mémoire dédiée aux comptes
    url: jdbc:h2:mem:accounts
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # Interface GraphiQL sur /graphiql (défaut Boot 3.5, posé explicitement pour l'examen)
  graphql:
    graphiql:
      enabled: true
  # Serveur MCP (Spring AI 1.1.8, starter spring-ai-starter-mcp-server-webmvc) :
  #   - transport par défaut = WEBMVC/SSE (défaut du starter ; sans /mcp/sse ni /mcp streamable)
  #   - handshake JSON-RPC : GET /sse (text/event-stream), le serveur renvoie
  #     un event "endpoint" avec /mcp/message?sessionId=... ; les messages JSON-RPC
  #     sont ensuite POSTés sur /mcp/message.
  #   - le protocole STREAMABLE nécessiterait le starter spring-ai-starter-mcp-server-streamable-webmvc
  #     (spring.ai.mcp.server.streamable-http.mcp-endpoint, défaut /mcp) — hors P5.
  # Inspection des outils : les 5 @Tool d'AccountMcpTools (contrat listAccounts, getAccount,
  # getAccountBalance, createAccount, updateAccountStatus) sont publiés au protocole MCP
  # via le ToolCallbackProvider déclaré dans AccountMcpServerConfig.
  ai:
    mcp:
      server:
        enabled: true
        name: account-mcp-server
        version: 1.0.0
        type: SYNC
        transport: WEBMVC
        sse-message-endpoint: /mcp/message

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Documentation OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
